<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Scheduler{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/pages.css">
    <script type="text/javascript">
        function formatStatus(status) {
            const classes = {
                'Success': 'status-badge success',
                'Failed': 'status-badge failed',
                'Cancelled': 'status-badge cancelled',
                'Running': 'status-badge running',
                'Scheduled': 'status-badge scheduled'
            };
            return `<span class="${classes[status] || 'status-badge'}">${status}</span>`;
        }

        function parseTime(timeStr) {
            // 1. Replace the space between Date and Time with 'T'
            // 2. Remove the space before the '+' or '-'
            // 3. Capture the offset but stop after the first 5 characters (+HH:mm)
            const normalized = timeStr
                .trim()
                .replace(" ", "T")
                .replace(/\s+([+-]\d{2}:\d{2}):\d{2}$/, "$1");

            return new Date(normalized);
        }

        function formatTime(timeStr) {
            if (!timeStr) return '-';
            const parsedTime = parseTime(timeStr);
            if (isNaN(parsedTime.getTime())) return '-';
            return parsedTime.toLocaleString();
        }

        function calculateDuration(startTime) {
            if (!startTime) return '-';
            const diff = new Date() - new Date(startTime);
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            if (minutes > 0) return `${minutes}m ${seconds % 60}s`;
            return `${seconds}s`;
        }
    </script>
    <style>
        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            /* slate-300 */
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--success);
        }

        input:checked+.slider:before {
            transform: translateX(24px);
        }

        /* Dark mode support for slider */
        [data-theme="dark"] .slider {
            background-color: #4b5563;
            /* gray-600 */
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🚀 Job Scheduler</h1>
            <ul class="nav-links">
                <li><a href="/" class="{{ if page == " dashboard": "active" else: "" }}">Dashboard</a></li>
                <li><a href="/tasks" class="{{ if page == " tasks": "active" else: "" }}">Tasks</a></li>
                <li><a href="/schedule" class="{{ if page == " schedule": "active" else: "" }}">Schedule</a></li>
                <li><a href="/executions" class="{{ if page == " executions": "active" else: "" }}">Executions</a></li>
                <li><a href="/users" class="{{ if page == " users": "active" else: "" }}">Users</a></li>
                <li><a href="/tokens" class="{{ if page == " tokens": "active" else: "" }}">Tokens</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Job Scheduler - Built with Nim</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="/static/app.js"></script>
    <div id="confirm-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="modal-title">Confirm Action</h3>
            <p id="modal-message">Are you sure?</p>
            <div class="modal-actions">
                <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
                <button id="modal-confirm" class="btn btn-danger">Confirm</button>
            </div>
        </div>
    </div>

    {% block scripts %}{% endblock %}
</body>

</html>
