<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Job Scheduler</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            const pref = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', saved || pref);
        })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at top, var(--primary-soft), transparent 55%), var(--bg-canvas);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 32px 28px;
        }

        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .login-brand .brand-mark {
            width: 44px;
            height: 44px;
            border-radius: 12px;
        }

        .login-brand h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .login-brand p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .login-error {
            display: none;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            background: var(--danger-soft);
            border: 1px solid var(--danger-border);
            color: var(--danger-text);
            font-size: 13px;
            margin-bottom: 14px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .login-submit {
            width: 100%;
            padding: 10px 16px;
            font-size: 14px;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"></circle>
                        <polyline points="12 7 12 12 15.5 14"></polyline>
                    </svg>
                </span>
                <h1>Job Scheduler</h1>
                <p>Sign in to manage tasks and monitor executions</p>
            </div>

            <div id="error" class="login-error" role="alert"></div>

            <form id="login-form" class="login-form">
                <div class="form-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary login-submit">Sign In</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');
            const submitBtn = document.getElementById('login-btn');

            errorEl.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in…';

            try {
                const keyResponse = await fetch('/api/publicKey');
                const keyData = await keyResponse.json();
                const publicKey = keyData.publicKey;

                const fullHash = CryptoJS.SHA256(publicKey);
                const key = fullHash;
                const iv = CryptoJS.lib.WordArray.create(fullHash.words.slice(0, 4));
                const encrypted = CryptoJS.AES.encrypt(password, key, {
                    iv: iv,
                    mode: CryptoJS.mode.CBC,
                    padding: CryptoJS.pad.Pkcs7
                });
                const encodedEncrypted = encrypted.ciphertext.toString(CryptoJS.enc.Hex);

                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password: encodedEncrypted })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('auth_token', data.token);
                    window.location.href = '/dashboard';
                } else {
                    errorEl.textContent = 'Invalid username or password.';
                    errorEl.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            } catch (error) {
                errorEl.textContent = 'Sign in failed: ' + error.message;
                errorEl.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
    </script>
</body>

</html>
