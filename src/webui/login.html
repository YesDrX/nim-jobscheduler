<!DOCTYPE html>
<html>

<head>
    <title>Login - Job Scheduler</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--light);
        }

        .login-box {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            font-size: 1rem;
            background: var(--input-bg);
            color: var(--text);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .error {
            color: var(--danger);
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .btn-full {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Job Scheduler</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="password" required>
                </div>
                <div id="error" class="error" style="display:none"></div>
                <button type="submit" class="btn btn-full">Login</button>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log('Login form submitted');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');
            const keyResponse = await fetch('/api/publicKey');
            const keyData = await keyResponse.json();
            const publicKey = keyData["publicKey"];

            const fullHash = CryptoJS.SHA256(publicKey);
            const key = fullHash;
            const iv = CryptoJS.lib.WordArray.create(fullHash.words.slice(0, 4));
            const encrypted = CryptoJS.AES.encrypt(
                password,
                key,
                {
                    iv: iv,
                    mode: CryptoJS.mode.CBC,
                    padding: CryptoJS.pad.Pkcs7
                });
            const encodedEncrypted = encrypted.ciphertext.toString(CryptoJS.enc.Hex);

            console.log('Attempting login for user:', username);

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: encodedEncrypted })
                });

                console.log('Login response status:', response.status);

                if (response.ok) {
                    const data = await response.json();
                    console.log('Login successful, token received:', data.token);
                    localStorage.setItem('auth_token', data.token);
                    console.log('Redirecting to dashboard...');
                    window.location.href = '/dashboard';
                } else {
                    console.error('Login failed with status:', response.status);
                    errorEl.textContent = 'Invalid username or password';
                    errorEl.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorEl.textContent = 'Login failed: ' + error;
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>

</html>
